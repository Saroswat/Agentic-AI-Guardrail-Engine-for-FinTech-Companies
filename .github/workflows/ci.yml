name: Validate platform
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: guardrail
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: guardrail
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-lock.txt
      - run: pytest -q --disable-warnings
      - run: python -m app.evaluate
      - run: alembic upgrade head && alembic check
        env:
          DATABASE_URL: postgresql+psycopg://guardrail:testpassword@localhost:5432/guardrail
  frontend:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: http://127.0.0.1:8010
      BOOTSTRAP_PASSWORD: ci-test-password-321
      E2E_PASSWORD: ci-test-password-321
      CORS_ORIGINS: http://127.0.0.1:3010
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r ../backend/requirements-lock.txt
      - run: npx playwright install --with-deps chromium
      - name: Browser workflow tests
        run: |
          cd ../backend
          python -m alembic upgrade head
          python -m uvicorn app.main:app --port 8010 > /tmp/guardrail-api.log 2>&1 &
          python -m app.services.investigation_worker > /tmp/guardrail-worker.log 2>&1 &
          cd ../frontend
          npm run start -- --port 3010 > /tmp/guardrail-web.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3010/login >/dev/null && break; sleep 2; done
          npm run test:e2e
